name: mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-bench:
    runs-on: macos-26-intel  # Intel, like the owner's laptop
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu hw.memsize
          rustc --version || true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release
      - name: Bench
        run: cargo run --release -p kanopy-cli -- bench --seconds 5 | tee bench.txt
      - name: Timing per part
        run: cargo run --release -p kanopy-core --example parts | tee -a bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt
      - name: Post results as an annotation (readable from the API)
        run: |
          {
            sysctl -n machdep.cpu.brand_string
            cat bench.txt
            cargo run -q --release -p kanopy-cli -- world-bench
          } > results.txt
          body=$(sed -e 's/%/%25/g' results.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=kanopy bench::${body}"
