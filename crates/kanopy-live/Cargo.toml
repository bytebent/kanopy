[package]
name = "kanopy-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kanopy live: plays a forest in real time on one render thread, for the app."

[dependencies]
kanopy-core = { path = "../kanopy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ringbuf = "0.4"
cpal = { version = "0.15", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["audio"]
# sound out through the system (CoreAudio on macOS); without it the engine paces itself silently
audio = ["dep:cpal"]
