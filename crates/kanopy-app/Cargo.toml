[package]
name = "kanopy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kanopy: the desktop app."

[[bin]]
name = "kanopy-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kanopy-core = { path = "../kanopy-core" }
kanopy-live = { path = "../kanopy-live" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
